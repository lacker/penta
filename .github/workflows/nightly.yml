name: Nightly sweep

# The deferred sweeps, native and browser. Both are the same shape: play a
# great many whole games and see whether anything comes loose. That is worth
# doing and a bad fit for a per-push gate -- five Rust sweeps outweighed two
# thousand normal tests by about thirty to one, and four browser sweeps were
# roughly ten times the rest of the web gate combined. Running them on every
# push meant every branch waited on them, and the Rust suite sat so close to
# its time budget that a busy runner alone could mark a change broken.
#
# Here, taking a while costs nothing. The tradeoff is that a failure is
# disconnected from whatever caused it, so both targets end by naming the
# failing test and the one command that reruns just it locally.
on:
  schedule:
    # 08:00 UTC, or early morning in the Americas.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-sweep:
    name: deferred simulation sweeps
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    # Generous on purpose. Nothing waits on this, so a sweep that grows is a
    # reason to let it run, not a reason to trim its coverage.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run the deferred sweeps
        run: make nightly-sweep

  web-sweep:
    name: deferred browser sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The CLI and crate must match exactly. The shared helper reads the crate
      # version from the lockfile instead of maintaining a second version pin.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(./scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: web/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run the deferred browser sweeps
        run: make nightly-sweep-web
