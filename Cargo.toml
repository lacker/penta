[workspace]
members = [".", "wasm", "bindings/penta-ffi", "tools/source-file-sizes"]
# penta-py links against a Python toolchain, so it builds on its own rather
# than dragging that requirement into every `cargo test`.
exclude = ["bindings/penta-py"]
resolver = "3"

# Keep local edit/rebuild cycles incremental in every standard profile. Clean
# CI builds disable incremental compilation so sccache can cache complete
# compiler outputs instead; the two caches optimize different workflows.
[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
# Preserve Cargo's non-incremental release partitioning so enabling the local
# cache does not trade away runtime quality for extra codegen parallelism.
codegen-units = 16
incremental = true

# Normal tests need enough optimization to exercise the engine promptly, but
# optimizing the 100k-symbol test harness as a release binary costs minutes on
# a clean builder. Many codegen units let rustc use the available cores during
# that otherwise non-cacheable build. Debug assertions and overflow checks stay
# on so the rules engine's invariant checks still fire.
[profile.quick-test]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
debug-assertions = true
overflow-checks = true

# The ignored simulation tier plays whole games and is substantially slower at
# low optimization levels. It runs outside the per-push gate, so preserve
# release optimization for those sweeps rather than imposing its build cost on
# every focused or normal test.
[profile.simulation-test]
inherits = "release"
incremental = true
debug-assertions = true
overflow-checks = true

[package]
name = "penta"
version = "0.7.0"
edition = "2024"
description = "A deterministic engine for two-player constructed Magic"
license = "Apache-2.0"
repository = "https://github.com/lacker/penta"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

# Keep profiling representative of release behavior while retaining enough
# symbol information for sampled stacks and source-level views.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
