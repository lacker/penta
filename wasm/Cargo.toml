[package]
name = "penta-wasm"
version = "0.7.0"
edition = "2024"
publish = false

[lib]
# rlib alongside cdylib so native tools -- the bug-replay example -- can
# link the same facade the browser runs.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes state-setting entry points for local development and testing. Never
# enable this for a build a player could reach: the engine has no business
# trusting a client that can write to the battlefield.
dev-cheats = []

[dependencies]
penta = { path = ".." }
serde_json = "1"
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
