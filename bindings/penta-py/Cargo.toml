[package]
name = "penta-py"
version = "0.7.0"
edition = "2024"
description = "Python bindings for the penta engine"
license = "Apache-2.0"
publish = false

# Standalone: the parent workspace excludes this crate so plain `cargo test`
# there never needs a Python toolchain.
[workspace]

[lib]
name = "penta"
crate-type = ["cdylib"]

# This crate is intentionally its own workspace, so it does not inherit the
# root workspace's release profile.
[profile.release]
codegen-units = 16
incremental = true

[dependencies]
# Renamed because this cdylib is itself the `penta` Python module.
engine = { package = "penta", path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
