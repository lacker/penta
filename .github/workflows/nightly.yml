name: Nightly sweep

# The deferred sweeps, native and browser. Both are the same shape: play a
# great many whole games and see whether anything comes loose. That is worth
# doing and a bad fit for a per-push gate -- five Rust sweeps outweighed two
# thousand normal tests by about thirty to one, and four browser sweeps were
# roughly ten times the rest of the web gate combined. Running them on every
# push meant every branch waited on them, and the Rust suite sat so close to
# its time budget that a busy runner alone could mark a change broken.
#
# Here, taking a while costs nothing. The tradeoff is that a failure is
# disconnected from whatever caused it, so both targets end by naming the
# failing test and the one command that reruns just it locally.
on:
  schedule:
    # 08:00 UTC, or early morning in the Americas.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-sweep:
    name: deferred simulation sweeps
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    # Generous on purpose. Nothing waits on this, so a sweep that grows is a
    # reason to let it run, not a reason to trim its coverage.
    #
    # Raised from 60 on 2026-09-01, and not because the sweeps grew. They did
    # not: the builtin gauntlet has played the same 55 pairings since
    # 2026-07-30, and Premodern went from seven decks to eight. The tier has
    # been killed at this limit every night since 08-23 and has reported
    # nothing since 08-21.
    #
    # The question this comment used to leave open -- compile time or test
    # time -- is settled: test time, and almost all of it in the Premodern
    # gauntlet. Timing that test per pairing showed the cost was not spread
    # over the grid at all. `legal_actions` was re-deriving two whole-board
    # sweeps inside the mana payment search, so per-action cost grew with the
    # square of the board and a handful of control pairings ran for hours
    # while most finished in under a second. Memoizing those two sweeps for
    # the life of one `&self` read, and dropping a quadratic dedup in the
    # additional-cost search, took the whole 72-pairing gauntlet to about
    # 33 minutes on an eight-core laptop.
    #
    # Keep this at 180 rather than restoring 60. The public runner is roughly
    # twice as slow, and one pairing -- the BW Control mirror on seed 2027 --
    # is still two thirds of the gauntlet on its own, so the headroom is real
    # but not large. If it needs raising again, time the pairings before
    # assuming the sweeps grew: this tier's cost has twice turned out to be
    # one game rather than the grid.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run the deferred sweeps
        run: make nightly-sweep

  web-sweep:
    name: deferred browser sweeps
    runs-on: ubuntu-24.04
    # Raised with the native sweep above, and for the same reason: this job
    # went from about five minutes in mid-August to being killed at the limit,
    # and the browser suites drive the same engine through WASM.
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The CLI and crate must match exactly. The shared helper reads the crate
      # version from the lockfile instead of maintaining a second version pin.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(./scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: web/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run the deferred browser sweeps
        run: make nightly-sweep-web
