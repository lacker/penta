name: CI

# Every lane runs a target from the root Makefile used locally. The lanes are
# independent so the longest Rust and browser simulations can run in parallel.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          # --retry alone covers HTTP 5xx and timeouts, but not a connection
          # reset mid-transfer, which is how this step has actually failed.
          # The checksum below is what makes retrying safe.
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive_path" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" actionlint
          "$install_dir/actionlint" -version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Check repository tooling
        run: make check-tooling

  check-rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml owns the version, components, and targets.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust
        run: make check-rust

  check-web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The CLI and crate must match exactly. The shared helper reads the crate
      # version from the lockfile instead of maintaining a second version pin.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(./scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: web/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Check web
        # The slow WASM sweeps are CPU-bound. Three test processes match
        # Node's effective capacity on the four-core public runner, while
        # Make can overlap lint/build and typecheck/production-build work.
        run: make -j3 WEB_TEST_CONCURRENCY=3 check-web

  check-bindings:
    name: bot bindings (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            target: check-bindings
          - python: "3.14"
            target: check-bindings-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Exercise the 3.13 support floor with the strict binding gate, then
      # smoke-test the stable-ABI extension on the current Python release.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the pinned Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # penta-py is its own workspace, so it needs naming separately.
          workspaces: |
            .
            bindings/penta-py

      - name: Check bindings
        run: make ${{ matrix.target }}
